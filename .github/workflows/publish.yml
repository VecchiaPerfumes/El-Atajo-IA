# Al aprobar (merge a main) se renderiza y se sube programado a YouTube.
# También se puede lanzar a mano: Actions > Publicar episodio > Run workflow > escribe ep001.
# Solo sube cuando existen los secretos YT_*; si no, deja el video como artifact.
name: Publicar episodio
on:
  push:
    branches: [main]
    paths: ["episodes/**"]
  workflow_dispatch:
    inputs:
      episodios:
        description: "Episodios a publicar, separados por espacio (ej: ep001 ep002)"
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      EPISODIOS: ${{ github.event.inputs.episodios }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Renderizar y subir
        run: |
          if [ -n "$EPISODIOS" ]; then
            lista=$(for e in $EPISODIOS; do echo "episodes/$e.yaml"; done)
          else
            lista=$(git diff --name-only HEAD~1 HEAD -- episodes/ | grep yaml$ || true)
          fi
          for f in $lista; do
            python -m gen.motion "$f"
            id=$(basename "$f" .yaml)
            if [ -n "$YT_REFRESH_TOKEN" ]; then python -m gen.upload "$id"; else echo "Sin secretos YT_*: no se sube $id"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: publicado
          path: |
            salida/*/*.mp4
            salida/*/*.jpg
            salida/*/*.json
          retention-days: 30
