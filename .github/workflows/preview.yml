# Cada episodio nuevo llega como pull request. Este flujo genera el video con voz real
# y lo deja como "artifact" para que lo revises antes de aprobar (merge).
name: Vista previa del episodio
on:
  pull_request:
    paths: ["episodes/**"]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Muestras de voz
        run: python -m gen.muestras
      - name: Renderizar episodios cambiados
        run: |
          for f in $(git diff --name-only origin/${{ github.base_ref }}... -- episodes/ | grep yaml$); do
            python -m gen.motion "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vista-previa
          path: |
            salida/*/*.mp4
            salida/*/*.jpg
            salida/*/*.json
            salida/muestras/*.mp3
          retention-days: 7
