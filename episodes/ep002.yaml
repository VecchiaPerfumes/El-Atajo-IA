id: ep002
titulo: "Crea 30 publicaciones de Instagram en 1 hora con IA (sin que parezcan de IA)"
miniatura:
  linea1: "30 POSTS"
  linea2: "EN 1 HORA CON IA"
  etiqueta: "PLANTILLA"
  chat: ["Escribe 30 posts para mi panadería", "Listo: calendario de noviembre"]
descripcion: |
  Cómo planear un mes completo de contenido para el Instagram de tu negocio en una hora,
  usando IA gratis, sin que suene genérico. Incluye la plantilla de instrucciones (prompt).

  00:00 El problema del contenido
  00:40 Por qué la IA escribe posts genéricos
  01:40 Paso 1: la ficha de voz de tu marca
  03:00 Paso 2: los 4 pilares de contenido
  04:20 Paso 3: el prompt de 30 publicaciones
  05:40 Paso 4: imágenes en Canva por lotes
  06:40 Errores que delatan que lo hizo una IA
etiquetas: [instagram para negocios, contenido con ia, chatgpt instagram, canva, marketing digital, emprendedores, calendario de contenido]
publicar: "2026-11-26T18:00:00-06:00"
escenas:
  - tipo: portada
    titulo: "Un mes de Instagram en una hora"
    subtitulo: "Con IA gratis y sin sonar a robot"
    narracion: >
      Publicar todos los días en Instagram te roba horas que deberías usar en vender.
      Hoy te enseño a dejar listo un mes completo de publicaciones en una sola hora, con inteligencia artificial gratis.
      Y lo más importante: sin que tus clientes noten que lo escribió una máquina.
  - tipo: dato
    cifra: "El error"
    texto: "Pedirle a la IA: escribe un post para mi negocio"
    nota: "Una instrucción vaga produce un texto genérico"
    narracion: >
      Casi todo el mundo usa la inteligencia artificial igual: abre el chat y escribe, haz un post para mi negocio.
      Y le sale un texto lleno de frases vacías, emojis por todas partes y cero personalidad.
      El problema no es la herramienta. Es que no le diste nada con qué trabajar.
      La inteligencia artificial no conoce a tus clientes, ni tus precios, ni cómo hablas tú.
      Así que en los próximos minutos le vamos a dar exactamente eso.
  - tipo: paso
    numero: 1
    titulo: "Escribe la ficha de voz de tu marca"
    puntos:
      - "A quién le vendes y qué le preocupa"
      - "Cómo hablas: tú o usted, serio o cercano"
      - "Palabras que usas y palabras prohibidas"
    narracion: >
      Paso uno: la ficha de voz de tu marca. Es un texto corto que vas a reutilizar cada mes.
      Primero, a quién le vendes y qué le preocupa. No pongas todo el mundo. Pon, por ejemplo, mamás que trabajan y no tienen tiempo de cocinar.
      Segundo, cómo hablas. ¿Tuteas o hablas de usted? ¿Eres serio o bromista?
      Tercero, las palabras que siempre usas y las que nunca usarías.
      Copia tres publicaciones tuyas que te gusten y pégalas al final. Ese es el mejor ejemplo que le puedes dar.
  - tipo: lista
    titulo: "Los 4 pilares de contenido"
    puntos:
      - "Enseñar: un consejo útil"
      - "Mostrar: detrás de escena"
      - "Demostrar: clientes y resultados"
      - "Vender: oferta clara con precio"
    narracion: >
      Paso dos: los cuatro pilares. Si solo publicas ofertas, la gente deja de mirarte.
      Reparte tus treinta publicaciones en cuatro tipos.
      Enseñar: un consejo que tu cliente pueda usar hoy.
      Mostrar: cómo trabajas por dentro, el proceso, el equipo.
      Demostrar: opiniones de clientes y resultados reales.
      Y vender: una oferta clara, con precio y con una sola acción, por ejemplo, escríbenos por WhatsApp.
      Una buena mezcla para empezar es una venta por cada tres publicaciones de valor.
  - tipo: paso
    numero: 3
    titulo: "El prompt de 30 publicaciones"
    puntos:
      - "Pega tu ficha de voz y tus pilares"
      - "Pide una tabla: día, pilar, gancho, texto"
      - "Pide 3 ganchos por post y elige tú"
    narracion: >
      Paso tres: el prompt. Abre Claude o ChatGPT, los dos tienen versión gratis.
      Pega tu ficha de voz, los cuatro pilares, y pide treinta publicaciones en una tabla con estas columnas: día, pilar, gancho, texto e idea de imagen.
      Aquí va el truco: pide tres ganchos distintos para cada publicación. La primera línea es la que hace que alguien se detenga, así que elígela tú.
      Te dejo el prompt completo en la descripción para que solo lo copies.
  - tipo: paso
    numero: 4
    titulo: "Diseña las imágenes por lotes en Canva"
    puntos:
      - "Una plantilla con tus colores"
      - "Crear en lote desde una hoja de cálculo"
      - "30 diseños en minutos"
    narracion: >
      Paso cuatro: las imágenes. En Canva haz una sola plantilla con tus colores y tu logo.
      Luego copia la columna de ganchos de tu tabla y usa la función de crear en lote.
      Canva rellena la plantilla con cada frase y te genera todos los diseños de una vez.
      Revisa que la función esté disponible en tu plan, porque Canva cambia sus opciones con frecuencia.
  - tipo: lista
    titulo: "Errores que delatan a la IA"
    puntos:
      - "Frases como: en el mundo actual"
      - "Emojis en cada línea"
      - "Cero datos de tu negocio"
    narracion: >
      Antes de publicar, revisa tres cosas que delatan a la inteligencia artificial.
      Frases de relleno, como en el mundo actual o descubre el secreto.
      Emojis en cada línea.
      Y textos que podrían ser de cualquier negocio. Si no menciona tu producto, tu precio o tu ciudad, reescríbelo.
      Esa revisión de diez minutos es la diferencia entre contenido que vende y contenido que la gente ignora.
  - tipo: cierre
    titulo: "Copia el prompt gratis"
    subtitulo: "Enlace en la descripción"
    narracion: >
      El prompt completo y la ficha de voz están en la descripción, gratis.
      En el próximo video conectamos esto con tus cobros, para que los recordatorios de pago se envíen solos.
      Suscríbete para no perdértelo.
